; The PHP settings of the back-end tests (#1740), for tools/test/run.sh. PHP_INI_SCAN_DIR adds this folder to the
; folders of the machine, so every worker process of a parallel run reads it too.

; No coverage driver unless the run asks for one (TEST_COVERAGE=1): PCOV slows every test. Xdebug is off through
; XDEBUG_MODE=off in the script (the variable of the environment wins over a file).
pcov.enabled = ${KNOWII_TEST_PCOV:-0}
xdebug.mode = off

; The opcode cache for the command line. A test boots the application again: without the cache, PHP compiles the
; configuration files, the routes and the compiled views again for each test (about 50 ms against 13 ms).
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
; A change of a file is seen at once
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
