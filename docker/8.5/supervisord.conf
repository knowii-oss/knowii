[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
# Knowii: Allow more open file descriptors (required for Reverb)
minfds=10000

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Knowii: Support for WebSockets
[program:reverb]
command=php /var/www/html/artisan reverb:start
autostart=true
autorestart=true
# Keep retrying while the database or Redis restarts (the default gives up after 3 quick failures)
startretries=100
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue_worker]
command=php /var/www/html/artisan queue:work
autostart=true
autorestart=true
# Keep retrying while the database or Redis restarts (the default gives up after 3 quick failures)
startretries=100
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# The Laravel scheduler (#1279): runs the scheduled tasks of routes/console.php every minute, without cron
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
startretries=100
user=%(ENV_SUPERVISOR_PHP_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
