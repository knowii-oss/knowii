; PHP settings of the production image (loaded after php.ini-production)

; #887: do not tell the world which PHP runs here
expose_php = Off

; Errors go to the container log, never to the page
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Same as the Sail image: the environment variables of the container are visible to PHP
variables_order = EGPCS

; Uploads: the images are 10 MB at most (App\Constants::MAX_UPLOAD_SIZE_KILOBYTES) and the course materials 50 MB by
; default (COURSE_MATERIALS_MAX_MB). Raise these two values (and max_size in docker/production/Caddyfile) together with it.
upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 256M

; OPcache: the code of the image never changes while the container runs, so PHP does not check the files again
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
