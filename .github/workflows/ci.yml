name: CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # Same database engine and major version as docker-compose.yml and production (SELF_HOSTING.md)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No later step uses git with the token
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
      - name: Install front-end dependencies
        run: npm ci
      # The dependencies that ship with the application fail the build.
      - name: Audit front-end dependencies security (production)
        run: npm audit --omit=dev --audit-level=moderate
      # The development dependencies build the front-end that ships, so a
      # critical advisory there fails the build too. A lower advisory in a
      # development tool is reported and does not fail the build: one with no
      # fixed version must not stop every pull request (#1608). The warning
      # stays on the run until the advisory is solved.
      - name: Audit front-end dependencies security (development, critical)
        run: npm audit --audit-level=critical
      - name: Report front-end dependencies security (development)
        run: |
          if ! npm audit --audit-level=moderate; then
            echo "::warning title=npm audit (development dependencies)::Open advisories in the development dependencies. Read the log of this step."
          fi

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # Cache composer dependencies
      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-

      # Reference: https://github.com/shivammathur/setup-php
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
      - name: Create .env file
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Install back-end dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      # The key comes before the static analysis: Larastan boots the application, and the session is encrypted by
      # default (ADR 0064)
      - name: Generate Laravel key
        run: php artisan key:generate
      - name: Audit PHP dependencies security
        run: composer audit

      # Runs after composer install: the type check resolves `ziggy-js` from vendor/tightenco/ziggy
      # Nx Affected runs only tasks affected by the changes in this PR. Learn more: https://nx.dev/ci/features/affected
      - name: Lint, type-check and test the front-end
        run: npx nx affected -t lint typecheck test
        env:
          NX_NO_CLOUD: true
      - name: Type-check the whole front-end (app, library, and configuration files)
        run: npm run tsc
      # Vitest runs the specs without a type check, and the check above leaves them out (#1557). The stories are in the check above.
      - name: Type-check the spec files (app and library)
        run: npm run tsc:spec
      # The static site of the component toolkit (#657), in dist/storybook. The stories run as tests with the other Vitest tests.
      - name: Build Storybook
        run: npm run storybook:build
        env:
          NX_NO_CLOUD: true
      - name: Check the formatting (Prettier and Pint)
        run: |
          npx nx format:check --all
          ./vendor/bin/pint --test
        env:
          NX_NO_CLOUD: true
      - name: Static analysis of the back-end (PHPStan)
        run: composer lint

      # Build the front-end assets so the Vite manifest
      # (public/build/manifest.json) exists for the back-end tests below.
      # Runs after composer install because the build resolves the `ziggy-js`
      # tsconfig alias from vendor/tightenco/ziggy. The manifest is no longer
      # committed to Git; it is generated here (and on deploy).
      - name: Build front-end assets
        run: npm run build
      - name: Configure FS permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Run database migrations
        env: &postgres-env
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: secret
        run: php artisan migrate --force
      - name: Execute back-end tests
        env: *postgres-env
        run: php artisan test
