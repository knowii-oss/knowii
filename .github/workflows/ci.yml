name: CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # Same database engine and major version as docker-compose.yml and production (SELF_HOSTING.md)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install front-end dependencies
        run: npm ci
      - name: Audit front-end dependencies security
        run: npm audit --audit-level=moderate

      - uses: nrwl/nx-set-shas@v5

      # Cache composer dependencies
      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-

      # Reference: https://github.com/shivammathur/setup-php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
      - name: Create .env file
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Install back-end dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Audit PHP dependencies security
        run: composer audit

      # Runs after composer install: the type check resolves `ziggy-js` from vendor/tightenco/ziggy
      # Nx Affected runs only tasks affected by the changes in this PR. Learn more: https://nx.dev/ci/features/affected
      - name: Lint, type-check and test the front-end
        run: npx nx affected -t lint typecheck test
        env:
          NX_NO_CLOUD: true
      - name: Type-check the whole front-end (app, library, and configuration files)
        run: npm run tsc

      # Build the front-end assets so the Vite manifest
      # (public/build/manifest.json) exists for the back-end tests below.
      # Runs after composer install because the build resolves the `ziggy-js`
      # tsconfig alias from vendor/tightenco/ziggy. The manifest is no longer
      # committed to Git; it is generated here (and on deploy).
      - name: Build front-end assets
        run: npm run build
      - name: Generate Laravel key
        run: php artisan key:generate
      - name: Configure FS permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Run database migrations
        env: &postgres-env
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: secret
        run: php artisan migrate --force
      - name: Execute back-end tests
        env: *postgres-env
        run: php artisan test
