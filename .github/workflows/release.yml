name: Release

concurrency: release

# Manual workflow
on: workflow_dispatch

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history for all tags and branches
          # This is necessary to calculate the version bump
          # Reference: https://github.com/release-it/conventional-changelog?tab=readme-ov-file#github-actions
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
      - run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - run: npm ci
      # Create and switch to a new branch before the release
      # This is necessary because the main branch is protected
      - run: |
          git switch --create release-${GITHUB_SHA}
          git push --set-upstream origin release-${GITHUB_SHA}
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - run: NX_NO_CLOUD=true && npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create and merge a PR for the release
      # This is a workaround for the main branch protection
      # Reference: https://github.com/krlmlr/pr-bots/blob/main/.github/workflows/write-file-branch-merge.yaml
      - run: |
          gh pr create --title "Release ${GITHUB_SHA}" --body "This is a Release PR" --base main --head release-${GITHUB_SHA}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          # The pull request of the release branch, by the name of its branch
          gh pr merge "release-${GITHUB_SHA}" --rebase
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Clean up the temporary release branch
      - run: |
          git checkout main
          git branch -D release-${GITHUB_SHA}
          git push origin --delete release-${GITHUB_SHA}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
